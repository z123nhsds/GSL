name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04
          - ubuntu-22.04
          - ubuntu-22.04
          - ubuntu-22.04
          - ubuntu-22.04
          - macos-13
          - macos-14
          - windows-2019
          - windows-2019
          - windows-2022
          - windows-2022
        include:
          # GCC 12 / 13 / 14 — Ubuntu 22.04
          - os: ubuntu-22.04
            name: "GCC 12"
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            name: "GCC 13"
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            name: "GCC 14"
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

          # Clang 16 / 17 / 18 — Ubuntu 22.04
          - os: ubuntu-22.04
            name: "Clang 16"
            compiler: clang-16
            cc: clang-16
            cxx: clang++-16
          - os: ubuntu-22.04
            name: "Clang 17"
            compiler: clang-17
            cc: clang-17
            cxx: clang++-17
          - os: ubuntu-22.04
            name: "Clang 18"
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18

          # XCode 14.3.1 — macOS 13
          - os: macos-13
            name: "XCode 14.3.1"
            compiler: xcode-14.3.1
            cc: clang
            cxx: clang++
            developer_dir: /Applications/Xcode_14.3.1.app/Contents/Developer

          # XCode 15.4 — macOS 14
          - os: macos-14
            name: "XCode 15.4"
            compiler: xcode-15.4
            cc: clang
            cxx: clang++
            developer_dir: /Applications/Xcode_15.4.app/Contents/Developer

          # VS2019 — MSVC & Clang-cl
          - os: windows-2019
            name: "VS2019 MSVC"
            compiler: msvc-2019
            cc: cl
            cxx: cl
            vs_version: "2019"
            vs_edition: "Community"
            generator: "Visual Studio 16 2019"
          - os: windows-2019
            name: "VS2019 Clang-cl"
            compiler: clang-cl-2019
            cc: clang-cl
            cxx: clang-cl
            vs_version: "2019"
            vs_edition: "Community"
            generator: "Visual Studio 16 2019"
            toolset: "ClangCL"

          # VS2022 — MSVC & Clang-cl
          - os: windows-2022
            name: "VS2022 MSVC"
            compiler: msvc-2022
            cc: cl
            cxx: cl
            vs_version: "2022"
            vs_edition: "Community"
            generator: "Visual Studio 17 2022"
          - os: windows-2022
            name: "VS2022 Clang-cl"
            compiler: clang-cl-2022
            cc: clang-cl
            cxx: clang-cl
            vs_version: "2022"
            vs_edition: "Community"
            generator: "Visual Studio 17 2022"
            toolset: "ClangCL"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC / Clang toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          wget -O - https://apt.llvm.org/llvm.sh | sudo bash -s -- 16
          wget -O - https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          wget -O - https://apt.llvm.org/llvm.sh | sudo bash -s -- 18
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-12 g++-13 g++-14 clang-16 clang-17 clang-18

      - name: Select XCode (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "${{ matrix.developer_dir }}"
          xcodebuild -version
          clang --version

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -DCI_TESTING=ON -DGSL_TEST=ON

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        working-directory: build
        run: ctest -C Release -V --no-tests=error
